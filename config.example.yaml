# Copy this file to config.yaml and edit values there.
# config.yaml is gitignored — never commit credentials.

model:
  finetune_repo: "grandhigh/Chatterbox-TTS-Indonesian"   # HF repo with t3_cfg.safetensors
  voice_default: "prompt_audio/sample_voice.wav"
  device: ""             # empty = auto (cuda > mps > cpu); "cpu" to force low-RAM
  fp16: false            # cuda only: half-precision activations (~half VRAM)

tunnel:
  mode: "share"          # local | share | ngrok | cloudflare  (local = no tunnel)
  password: ""           # empty = auto-generate & printed to console

params:
  temperature: 0.25      # 0.1 - 1.0
  tempo: 1.0             # 0.8 - 1.5  (1.0 = normal speed)
  pitch: 0               # -4 - +4 semitone
  gap: 0.3               # 0.1 - 1.0 s silence between chunks

output:
  mp3: false             # true = encode MP3 (needs ffmpeg)
  keep_chunks: true      # false = delete chunks after merge (save disk)

api:
  host: "127.0.0.1"      # bind host for local REST API
  port: 8000             # port for local REST API
  api_key: "dev-local-secret-key"  # X-API-Key header auth (or set ENV: TTS_API_KEY)
  default_profile: "low_resource"  # low_resource (kentang) | fast (dewa)
  output_dir: "outputs/api"        # audio output directory for batch jobs
